<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Top arc for "SB" text -->
    <path id="topArc" d="M 40,95 A 62,62 0 0,1 160,95" fill="none" />
    <!-- Bottom arc for "2009" text -->
    <path id="bottomArc" d="M 155,120 A 58,58 0 0,1 45,120" fill="none" />
  </defs>

  <!-- Outer gold border ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#C8962E" stroke-width="4" />

  <!-- Dark green filled circle -->
  <circle cx="100" cy="100" r="94" fill="#1B4332" />

  <!-- Inner subtle gold ring for depth -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#C8962E" stroke-width="1.5" opacity="0.35" />

  <!-- Green wave/hill behind book -->
  <path d="M 50,118 Q 100,92 150,118 L 150,138 Q 100,112 50,138 Z" fill="#2D6A4F" />

  <!-- Open book - left page -->
  <path d="M 100,98 L 100,128 Q 82,124 66,128 L 66,100 Q 82,96 100,98 Z" fill="#FAF6F0" />
  <!-- Open book - right page -->
  <path d="M 100,98 L 100,128 Q 118,124 134,128 L 134,100 Q 118,96 100,98 Z" fill="#FAF6F0" />
  <!-- Book spine shadow -->
  <line x1="100" y1="97" x2="100" y2="129" stroke="#C8962E" stroke-width="1.5" opacity="0.6" />
  <!-- Left page lines -->
  <line x1="74" y1="106" x2="94" y2="103" stroke="#1B4332" stroke-width="0.8" opacity="0.3" />
  <line x1="74" y1="112" x2="94" y2="109" stroke="#1B4332" stroke-width="0.8" opacity="0.3" />
  <line x1="74" y1="118" x2="94" y2="115" stroke="#1B4332" stroke-width="0.8" opacity="0.3" />
  <!-- Right page lines -->
  <line x1="106" y1="103" x2="126" y2="106" stroke="#1B4332" stroke-width="0.8" opacity="0.3" />
  <line x1="106" y1="109" x2="126" y2="112" stroke="#1B4332" stroke-width="0.8" opacity="0.3" />
  <line x1="106" y1="115" x2="126" y2="118" stroke="#1B4332" stroke-width="0.8" opacity="0.3" />

  <!-- "SB" text on top arc -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="32" fill="#C8962E" letter-spacing="8">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">SB</textPath>
  </text>

  <!-- "2009" text on bottom arc -->
  <text font-family="Georgia, 'Times New Roman', serif" font-weight="bold"
        font-size="18" fill="#C8962E" letter-spacing="3">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">2009</textPath>
  </text>
</svg>
